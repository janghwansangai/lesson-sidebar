name: 자동 검사

# 2026-11-22: 비공개 때 무료 검사 시간(맥은 1분이 10분)을 다 써서 검사가 멈췄고, 그 뒤 저장소를 공개로 바꿔 검사 시간은 무료가 됐다.
# 그래도 빨리 끝나고 덜 시끄럽게 돌린다:
# - PR에서만 돈다 (같은 내용을 push·PR로 두 번 돌리지 않음). 필요하면 Actions 탭에서 손으로 돌린다
# - 문서만 바꾼 PR은 건너뛴다
# - 맥 한 개, 윈도우 한 개 작업 (일은 단계로 나눔)
# - 같은 PR에 새로 올리면 앞의 검사는 멈춘다
# - 설치판 만들어 켜 보기는 app·도우미·공통 로직·이 설정이 바뀐 PR에서만 (윈도우는 설치 파일로 조용히 설치·켜 보기·지우기까지)
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: 맥 검사
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 공통 로직 테스트
        run: npm test
        working-directory: poc
      - name: 체험판 라이브러리 설치
        run: npm ci
        working-directory: app
      - name: 체험판 테스트
        run: npm test
        working-directory: app
      - name: 설치판까지 확인할 PR인지 (app·맥 도우미·공통 로직·검사 설정이 바뀜)
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(app/|poc/mac-helper/|poc/lib/|\.github/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 설치판 만들기 (맥 도우미 빌드 포함)
        if: steps.changed.outputs.app == 'true'
        run: npm run dist:mac:dir
        env:
          SIDEBAR_SMOKE_BUILD: '1'   # CI 시험용 설치판만 시험 모드를 받는다 (build/after-pack.cjs)
        working-directory: app
      - name: 설치판을 켜서 예시 수업·준비 화면이 열리는지
        if: steps.changed.outputs.app == 'true'
        run: npm run smoke:mac
        working-directory: app

  windows:
    name: 윈도우 검사
    runs-on: windows-latest
    timeout-minutes: 30   # 설치판을 만드는 PR은 설치 파일 두 개를 압축하느라 몇 분 더 걸린다
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            poc/win-helper/package-lock.json
      - name: 공통 로직 테스트
        run: npm test
        working-directory: poc
      - name: 체험판 라이브러리 설치 (zip 등, 빌드 도구는 빼고)
        run: npm ci --omit=dev
        working-directory: app
      - name: 체험판 테스트
        run: npm test
        working-directory: app
      - name: 윈도우 도우미 설치
        run: npm ci
        working-directory: poc/win-helper
      - name: 윈도우 도우미 실행 (API 불러오기·창 목록 읽기)
        run: |
          node winctl.js trusted
          node winctl.js displays
          node winctl.js list
        working-directory: poc/win-helper
      - name: 설치판까지 확인할 PR인지 (app·윈도우 도우미·공통 로직·검사 설정이 바뀜)
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(app/|poc/win-helper/|poc/lib/|\.github/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 설치판 만드는 도구 설치 (electron·electron-builder)
        if: steps.changed.outputs.app == 'true'
        run: npm ci
        working-directory: app
      - name: 설치 파일(setup.exe)·설치 없이 켜는 파일(portable.exe) 만들기 (도우미 포함)
        if: steps.changed.outputs.app == 'true'
        run: npm run dist:win
        working-directory: app
        env:
          SIDEBAR_SMOKE_BUILD: '1'   # CI 시험용 설치판만 시험 모드를 받는다 (build/after-pack.cjs)
      - name: 앱 폴더를 켜서 도우미·예시 수업·준비 화면이 되는지
        if: steps.changed.outputs.app == 'true'
        run: npm run smoke:win
        working-directory: app
      - name: 조용히 설치 → 설치된 앱 켜 보기 → 지우기
        if: steps.changed.outputs.app == 'true'
        shell: pwsh
        working-directory: app
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem dist -Filter '*-win-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw '설치 파일이 없습니다' }
          if (-not (Get-ChildItem dist -Filter '*-win-portable.exe')) { throw '설치 없이 켜는 파일이 없습니다' }
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\lesson-sidebar'
          $exe = Join-Path $dir 'LessonSidebar.exe'
          if (-not (Test-Path $exe)) { throw "설치되지 않았습니다: $exe" }
          node scripts/smoke-packaged.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw '설치된 앱 켜 보기 실패' }
          Start-Process (Join-Path $dir 'Uninstall LessonSidebar.exe') -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $exe) { throw '지워지지 않았습니다' }
          Write-Host '통과: 설치 → 켜기 → 지우기'
