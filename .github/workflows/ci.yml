name: 자동 검사

# 2026-11-22: 비공개 때 무료 검사 시간(맥은 1분이 10분)을 다 써서 검사가 멈췄고, 그 뒤 저장소를 공개로 바꿔 검사 시간은 무료가 됐다.
# 그래도 빨리 끝나고 덜 시끄럽게 돌린다:
# - PR에서만 돈다 (같은 내용을 push·PR로 두 번 돌리지 않음). 필요하면 Actions 탭에서 손으로 돌린다
# - 문서만 바꾼 PR은 건너뛴다
# - 맥 한 개, 윈도우 한 개 작업 (일은 단계로 나눔)
# - 같은 PR에 새로 올리면 앞의 검사는 멈춘다
# - 설치판 만들어 켜 보기는 app·맥 도우미·공통 로직·이 설정이 바뀐 PR에서만
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: 맥 검사
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 공통 로직 테스트
        run: npm test
        working-directory: poc
      - name: 체험판 라이브러리 설치
        run: npm ci
        working-directory: app
      - name: 체험판 테스트
        run: npm test
        working-directory: app
      - name: 설치판까지 확인할 PR인지 (app·맥 도우미·공통 로직·검사 설정이 바뀜)
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(app/|poc/mac-helper/|poc/lib/|\.github/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 설치판 만들기 (맥 도우미 빌드 포함)
        if: steps.changed.outputs.app == 'true'
        run: npm run dist:mac:dir
        working-directory: app
      - name: 설치판을 켜서 예시 수업·준비 화면이 열리는지
        if: steps.changed.outputs.app == 'true'
        run: npm run smoke:mac
        working-directory: app

  windows:
    name: 윈도우 검사
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            poc/win-helper/package-lock.json
      - name: 공통 로직 테스트
        run: npm test
        working-directory: poc
      - name: 체험판 라이브러리 설치 (zip 등, 빌드 도구는 빼고)
        run: npm ci --omit=dev
        working-directory: app
      - name: 체험판 테스트
        run: npm test
        working-directory: app
      - name: 윈도우 도우미 설치
        run: npm ci
        working-directory: poc/win-helper
      - name: 윈도우 도우미 실행 (API 불러오기·창 목록 읽기)
        run: |
          node winctl.js trusted
          node winctl.js displays
          node winctl.js list
        working-directory: poc/win-helper
