name: 자동 검사

on:
  push:
  pull_request:

jobs:
  test:
    name: 공통 로직 테스트 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: poc
      - name: 체험판 라이브러리 설치 (zip 등, 빌드 도구는 빼고)
        run: npm ci --omit=dev
        working-directory: app
      - name: 체험판 수업 진행 로직 테스트
        run: npm test
        working-directory: app

  win-helper:
    name: 윈도우 도우미 실행 확인
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: poc/win-helper
      - name: 윈도우 API 불러오기·창 목록 읽기
        run: |
          node winctl.js trusted
          node winctl.js displays
          node winctl.js list
        working-directory: poc/win-helper

  mac-helper:
    name: 맥 도우미 빌드
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
        working-directory: poc/mac-helper

  mac-app:
    name: 맥 설치판 만들어 켜 보기
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - name: 설치판(.app) 만들기 (도우미 빌드 포함)
        run: npm run dist:mac:dir
        working-directory: app
      - name: 앱을 켜서 예시 수업·준비 화면이 열리는지
        run: npm run smoke:mac
        working-directory: app
