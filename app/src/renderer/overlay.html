<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
<title>발표 도구</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="grab" class="grab" hidden><img id="frozen" alt=""><div id="sel" class="sel" hidden></div></div>
  <div id="spot" class="spot" hidden></div>
  <div id="pen" class="pen" hidden>
    <canvas id="ink"></canvas><canvas id="live"></canvas>
  </div>
  <div id="penbar" class="penbar" hidden role="toolbar" aria-label="판서 펜">
    <span id="grip" class="grip" title="끌어서 옮기기" aria-hidden="true"><svg viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg></span>
    <span class="pgrp" id="colors">
      <button type="button" class="sw" data-color="#e5484d" aria-label="빨강"></button>
      <button type="button" class="sw" data-color="#2f6fe4" aria-label="파랑"></button>
      <button type="button" class="sw" data-color="#22a06b" aria-label="초록"></button>
      <button type="button" class="sw" data-color="#f5c518" aria-label="노랑"></button>
      <button type="button" class="sw" data-color="#1d1d1f" aria-label="검정"></button>
      <button type="button" class="sw" data-color="#ffffff" aria-label="흰색"></button>
    </span>
    <span class="pgrp">
      <button type="button" class="pb" data-mode="pen">펜</button>
      <button type="button" class="pb" data-mode="marker">형광펜</button>
      <button type="button" class="pb" data-mode="eraser">지우개</button>
    </span>
    <span class="pgrp" id="sizes">
      <button type="button" class="sz" data-size="2" aria-label="가늘게"><i></i></button>
      <button type="button" class="sz" data-size="4" aria-label="보통"><i></i></button>
      <button type="button" class="sz" data-size="8" aria-label="굵게"><i></i></button>
    </span>
    <span class="pgrp">
      <button type="button" class="pb" id="undo" aria-label="되돌리기">↶ 되돌리기</button>
      <button type="button" class="pb" id="clear">모두 지우기</button>
      <button type="button" class="pb" id="save">저장</button>
      <button type="button" class="pb off" id="pen-off" aria-label="판서 끄기">✕</button>
    </span>
  </div>
  <div id="ripples"></div>
  <div id="ring" class="ring" hidden></div>
  <div id="hint" class="hint" hidden>스포트라이트 · 휠로 크기 · Esc 또는 두 번 눌러 끄기</div>
  <script src="overlay.js"></script>
</body>
</html>
