<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>수업 사이드바</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="strip" class="strip" hidden title="이 막대 옆으로 마우스를 밀면 사이드바가 나옵니다"></div>
  <main id="panel" class="panel">
    <div id="trustbar" class="trustbar" role="alert" hidden>
      <b>손쉬운 사용 권한이 꺼져 있습니다</b>
      <span>그래서 자료 창을 찾거나 옮기지 못합니다. 시스템 설정 → 개인정보 보호 및 보안 → 손쉬운 사용에서 '수업 사이드바'를 켜 주세요. 이미 켜져 있으면 −로 지운 뒤 사이드바를 다시 켜서 새로 허용해 주세요.</span>
      <button id="ax-open" class="dbtn" type="button">손쉬운 사용 설정 열기</button>
    </div>
    <div id="recbar" class="recbar" hidden><span class="dotrec" aria-hidden="true"></span><b>녹화 중</b><span id="rec-time">00:00</span><span id="rec-where" class="rw"></span>
      <button id="rec-stop" class="rbtn" type="button">녹화 끝내기</button></div>
    <header class="head">
      <div class="top">
        <span class="brand">수업 사이드바 <em>체험판</em></span>
        <button id="btn-prefs" class="ib" aria-pressed="false" aria-expanded="false" aria-controls="prefs" title="설정" aria-label="설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button id="btn-hide" class="ib" aria-pressed="false" title="자동 숨김" aria-label="자동 숨김">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg>
        </button>
      </div>
      <div id="prefs" class="prefs" hidden>
        <div class="pref-h">펼친 사이드바 투명도 <span class="pref-sub">(배경만 비침)</span></div>
        <div id="opacity" class="seg" role="group" aria-label="펼친 사이드바 투명도"></div>
        <div class="pref-h">녹화</div>
        <label class="pref-row"><input id="rec-mic" type="checkbox"><span>마이크 소리도 녹화<small>선생님 목소리를 함께 남깁니다. 학생 목소리도 들어갈 수 있습니다.</small></span></label>
        <label class="pref-row"><input id="rec-light" type="checkbox"><span>가볍게 녹화 (720p · 15장/초)<small>느린 PC에서 수업이 버벅이면 켜 주세요. 용량도 절반쯤입니다.</small></span></label>
        <label id="aside-row" class="pref-row" hidden>
          <input id="aside" type="checkbox">
          <span>고정해 둘 때 가려지는 창을 옆으로 비키기<small>교사 화면에서 사이드바에 가려지는 창(선생님 창 포함)을 오른쪽으로 옮깁니다. 맥은 고정해 둔 동안 새로 가려지는 창도 옮깁니다. 자동 숨김을 켜면 이 설정은 꺼지고, 끄거나 끝내면 창을 돌려놓습니다.</small></span>
        </label>
      </div>
      <h1 id="title" class="title"></h1>
      <p id="meta" class="meta"></p>
      <div id="screens" class="screens"></div>
      <div id="preview" class="preview" hidden><img id="preview-img" alt="학생 화면 미리보기"><canvas id="preview-canvas" hidden></canvas><span id="preview-tag" class="ptag"></span></div>
      <button id="next" class="next"></button>
    </header>
    <section id="list" class="list" aria-label="수업 자료"></section>
    <div id="dock" class="dock" hidden></div>
    <footer class="foot">
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
      <button id="offer" class="dbtn offer" hidden></button>
      <div class="row" role="group" aria-label="발표 도구">
        <button id="tool-pointer" class="fb tool" aria-pressed="false" title="커서 주변에 노란 원 (클릭은 그대로 아래 프로그램에)">포인터 강조</button>
        <button id="tool-spot" class="fb tool" aria-pressed="false" title="화면을 어둡게 하고 커서 주변만 밝게 (휠로 크기, Esc로 끄기)">스포트라이트</button>
      </div>
      <div class="row" role="group" aria-label="화면을 찍는 도구">
        <button id="tool-zoom" class="fb tool" aria-pressed="false" title="커서가 있는 화면을 멈추고 확대 (휠로 배율, 클릭·Esc로 끝)">확대</button>
        <button id="tool-pin" class="fb tool" aria-pressed="false" title="끌어서 고른 부분을 항상 위 작은 창으로 고정 (수업 폴더 _캡처에 저장)">캡처 핀</button>
        <button id="pins-close" class="fb quiet" hidden title="고정한 캡처 핀을 모두 닫습니다">핀 닫기</button>
      </div>
      <div class="row">
        <button id="openall" class="fb">모두 미리 열기</button>
        <button id="hideothers" class="fb">다른 창 숨기기</button>
      </div>
      <div class="row">
        <button id="closeall" class="fb" title="사이드바가 연 자료 창을 모두 닫습니다 (선생님이 원래 열어 둔 창은 그대로, 저장할지 묻는 창은 답을 기다림)">사이드바가 연 창 모두 닫기</button>
      </div>
      <div class="row">
        <button id="record" class="fb rec" title="학생 화면(모니터 한 대면 이 화면)을 녹화합니다. 자료를 바꿀 때마다 목차를 남깁니다">● 녹화</button>
        <button id="folder" class="fb">수업 준비</button>
        <button id="quit" class="fb quiet">끝내기</button>
      </div>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
