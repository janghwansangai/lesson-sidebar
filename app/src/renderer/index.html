<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>수업 사이드바</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="strip" class="strip" hidden title="이 막대 옆으로 마우스를 밀면 사이드바가 나옵니다"></div>
  <main id="panel" class="panel">
    <div id="trustbar" class="trustbar" role="alert" hidden>
      <b>손쉬운 사용 권한이 꺼져 있습니다</b>
      <span>그래서 자료 창을 찾거나 옮기지 못합니다. 시스템 설정 → 개인정보 보호 및 보안 → 손쉬운 사용에서 '수업 사이드바'를 켜 주세요. 이미 켜져 있으면 −로 지운 뒤 사이드바를 다시 켜서 새로 허용해 주세요.</span>
      <button id="ax-open" class="dbtn" type="button">손쉬운 사용 설정 열기</button>
    </div>
    <div id="recbar" class="recbar" hidden><span class="dotrec" aria-hidden="true"></span><b>녹화 중</b><span id="rec-time">00:00</span><span id="rec-where" class="rw"></span>
      <button id="rec-stop" class="rbtn" type="button">녹화 끝내기</button></div>
    <div id="updbar" class="updbar" role="status" hidden>
      <span id="upd-t"></span>
      <div class="row">
        <button id="upd-get" class="fb" type="button">내려받기</button>
        <button id="upd-later" class="fb quiet" type="button">나중에</button>
      </div>
    </div>
    <header class="head">
      <div class="top">
        <span class="brand">수업 사이드바 <em>체험판</em></span>
        <button id="btn-prefs" class="ib" aria-pressed="false" aria-expanded="false" aria-controls="prefs" data-tip="설정|투명도, 녹화, 새 버전 알림, 창 비키기" aria-label="설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button id="btn-hide" class="ib" aria-pressed="false" data-tip="자동 숨김|사이드바를 접어 왼쪽 끝 노란 막대만 남깁니다. 막대 쪽으로 마우스를 밀면 다시 나옵니다" aria-label="자동 숨김">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg>
        </button>
      </div>
      <div id="prefs" class="prefs" hidden>
        <div class="pref-h">펼친 사이드바 투명도 <span class="pref-sub">(배경만 비침)</span></div>
        <div id="opacity" class="seg" role="group" aria-label="펼친 사이드바 투명도"></div>
        <div class="pref-h">녹화</div>
        <label class="pref-row"><input id="rec-mic" type="checkbox"><span>마이크 소리도 녹화<small>선생님 목소리를 함께 남깁니다. 학생 목소리도 들어갈 수 있습니다.</small></span></label>
        <label class="pref-row"><input id="rec-light" type="checkbox"><span>가볍게 녹화 (720p · 15장/초)<small>느린 PC에서 수업이 버벅이면 켜 주세요. 용량도 절반쯤입니다.</small></span></label>
        <div class="pref-h">새 버전 <span id="ver" class="pref-sub"></span></div>
        <label class="pref-row"><input id="upd-check" type="checkbox"><span>새 버전 알림<small>하루 한 번 새 설치판이 나왔는지 확인합니다. 깔기는 직접 합니다.</small></span></label>
        <button id="upd-now" class="fb quiet" type="button">지금 확인</button>
        <label id="aside-row" class="pref-row" hidden>
          <input id="aside" type="checkbox">
          <span>고정해 둘 때 가려지는 창을 옆으로 비키기<small>교사 화면에서 사이드바에 가려지는 창(선생님 창 포함)을 오른쪽으로 옮깁니다. 맥은 고정해 둔 동안 새로 가려지는 창도 옮깁니다. 자동 숨김을 켜면 이 설정은 꺼지고, 끄거나 끝내면 창을 돌려놓습니다.</small></span>
        </label>
      </div>
      <h1 id="title" class="title"></h1>
      <p id="meta" class="meta"></p>
      <div id="screens" class="screens"></div>
      <div id="preview" class="preview" hidden><img id="preview-img" alt="학생 화면 미리보기"><canvas id="preview-canvas" hidden></canvas><span id="preview-tag" class="ptag"></span></div>
      <button id="next" class="next"></button>
    </header>
    <section id="list" class="list" aria-label="수업 자료"></section>
    <div id="dock" class="dock" hidden></div>
    <footer class="foot">
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
      <button id="offer" class="dbtn offer" hidden></button>
      <div id="remote" class="remote" hidden>
        <div class="rm-h"><b>휴대폰 리모컨</b><span id="rm-phones" class="rm-ph"></span></div>
        <div id="rm-qr" class="rm-qr"></div>
        <p id="rm-url" class="rm-url"></p>
        <div class="row">
          <button id="rm-toggleqr" class="fb quiet" type="button"></button>
          <button id="rm-new" class="fb quiet" type="button" title="주소를 새로 만듭니다. 지금 연결된 휴대폰은 끊깁니다">새 주소</button>
        </div>
      </div>
      <div class="dock2">
        <div class="grp" role="group" aria-label="발표 도구">
        <button id="tool-pointer" class="ic tool" type="button" aria-label="포인터 강조" data-tip="포인터 강조|커서 주변에 노란 원을 띄웁니다. 클릭은 그대로 아래 프로그램에 갑니다" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l6.5 16 2.2-6.3L20 10.5z"/><circle cx="17.5" cy="17.5" r="3.2" stroke-dasharray="2 2"/></svg></button>
        <button id="tool-spot" class="ic tool" type="button" aria-label="스포트라이트" data-tip="스포트라이트|화면을 어둡게 하고 커서 주변만 밝게 합니다. 휠로 크기, Esc로 끄기" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
        <button id="tool-zoom" class="ic tool" type="button" aria-label="확대" data-tip="확대|커서가 있는 화면을 멈추고 크게 봅니다. 휠로 배율, 클릭·Esc로 끝 (화면 기록 권한)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21M10.5 7.5v6M7.5 10.5h6"/></svg></button>
        <button id="tool-pin" class="ic tool" type="button" aria-label="캡처 핀" data-tip="캡처 핀|끌어서 고른 부분을 항상 위 작은 창으로 고정합니다. 수업 폴더 _캡처에 저장 (화면 기록 권한)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 3.5 3.5H6.5L10 9z"/><path d="M12 12.5V21"/></svg></button>
        <button id="pins-close" class="ic quiet" type="button" aria-label="핀 모두 닫기" data-tip="핀 모두 닫기|화면에 고정한 캡처 핀을 모두 닫습니다 (저장한 그림은 그대로)" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 3.5 3.5H6.5L10 9z"/><path d="M12 12.5V16M16 18l4 4M20 18l-4 4"/></svg></button>
        </div>
        <div class="grp" role="group" aria-label="수업 진행">
        <button id="record" class="ic rec" type="button" aria-label="녹화" data-tip="녹화|학생 화면(모니터 한 대면 이 화면)을 녹화합니다. 자료를 바꿀 때마다 목차를 남깁니다" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle class="dot" cx="12" cy="12" r="3.6" fill="currentColor" stroke="none"/></svg></button>
        <button id="presenter" class="ic tool" type="button" aria-label="발표자 화면" data-tip="발표자 화면|교사 화면에 진행 메모, 구간 시계, 다음 자료를 크게 보여 줍니다" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12.5" rx="1.6"/><path d="M8 20.5h8M12 16.5v4M6.5 8h6M6.5 11h4M15.5 8.5l2.5 2-2.5 2"/></svg></button>
        <button id="remote-on" class="ic tool" type="button" aria-label="휴대폰 리모컨" data-tip="휴대폰 리모컨|같은 와이파이의 휴대폰으로 다음·이전, 정지·가리기를 합니다 (QR로 연결)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2M10 8.5l2 2 2-2"/></svg></button>
        </div>
      </div>
      <div class="grp wide" role="group" aria-label="창 정리">
        <button id="openall" class="fb" type="button" data-tip="모두 미리 열기|수업 자료를 모두 열어 둡니다. 학생 화면에는 첫 자료만 보이고 나머지는 최소화">미리 열기</button>
        <button id="hideothers" class="fb" type="button" data-tip="다른 창 숨기기|학생 화면에서 지금 자료만 남기고 나머지는 최소화합니다">다른 창 숨김</button>
        <button id="closeall" class="fb" type="button" data-tip="사이드바가 연 창 모두 닫기|두 번 누르면 사이드바가 연 자료 창을 닫습니다. 선생님이 원래 열어 둔 창은 그대로, 저장할지 묻는 창은 답을 기다림">모두 닫기</button>
      </div>
      <div class="row">
        <button id="folder" class="fb" type="button">수업 준비</button>
        <button id="quit" class="fb quiet" type="button">끝내기</button>
      </div>
    </footer>
  </main>
  <div id="tip" class="tip" role="tooltip" hidden><b></b><span></span></div>
  <script type="module" src="app.js"></script>
</body>
</html>
